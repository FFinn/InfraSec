apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: infrasec-keycloak
  namespace: infrasec-vault
spec:
  secretName: infrasec-keycloak-tls
  duration: 720h
  renewBefore: 120h
  dnsNames: [keycloak.infrasec.internal]
  ipAddresses: [10.91.0.36]
  privateKey:
    algorithm: ECDSA
    size: 256
  usages: [server auth]
  issuerRef:
    name: infrasec-ca
    kind: Issuer
